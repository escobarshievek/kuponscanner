
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCR Ticket Validator</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172033;
}

.container {
  max-width: 440px;
  margin: auto;
}

.header {
  text-align: center;
  margin-bottom: 22px;
}

.header h2 {
  margin-bottom: 5px;
  color: #123b63;
}

.header p {
  color: #64748b;
  font-size: 13px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
  margin-bottom: 15px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 15px;
  margin-bottom: 14px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

.start {
  background: #145b94;
  color: white;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
}

#reader video {
  border-radius: 12px;
}

.result {
  display: none;
  padding: 18px;
  border-radius: 12px;
  margin-top: 15px;
}

.valid {
  background: #dcfce7;
  color: #166534;
}

.used {
  background: #fee2e2;
  color: #991b1b;
}

.invalid {
  background: #fef3c7;
  color: #92400e;
}

.result h3 {
  margin-top: 0;
}

.result p {
  font-size: 14px;
  margin: 7px 0;
}

.small {
  font-size: 12px;
  color: #64748b;
  text-align: center;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>PCR TICKET VALIDATOR</h2>
    <p>Sistem Validasi Tiket dan Kartu Peserta</p>
  </div>

  <div class="card">

    <label>PIN PETUGAS</label>
    <input
      type="password"
      id="pin"
      placeholder="Masukkan PIN petugas"
      autocomplete="off"
    >

    <button class="start" id="startBtn" onclick="startCamera()">
      AKTIFKAN KAMERA
    </button>

  </div>

  <div class="card">
    <div id="reader"></div>
    <p class="small" id="cameraStatus">
      Kamera belum diaktifkan.
    </p>
  </div>

  <div id="result" class="result">
    <h3 id="resultTitle"></h3>
    <p id="resultMessage"></p>
    <p id="resultName"></p>
    <p id="resultId"></p>
    <p id="resultInstansi"></p>
  </div>

  <p class="small">
    POLITEKNIK CALTEX RIAU<br>
    Ticket Validation System
  </p>

</div>

<script>

// GANTI DENGAN URL WEB APP APPS SCRIPT.
const API_URL = 'https://script.google.com/macros/s/AKfycbx1KJSuN8bBhQYW1C0Vc_L32qAEvQVHXntuUUxq-Xw2YRa3F9hD07BMsJWSCcNQP3nxJw/exec';

const params = new URLSearchParams(window.location.search);
const SESI = params.get("sesi") || "pagi";

let sedangMemproses = false;

function kirimKeServer(id) {
  if (sedangMemproses) return;

  sedangMemproses = true;

  const callbackName = "scanCallback_" + Date.now();

  const script = document.createElement("script");

  const query = new URLSearchParams({
    action: "scan",
    id: id,
    pin: document.getElementById("pin").value,
    sesi: SESI,
    callback: callbackName
  });

  window[callbackName] = function(data) {
    delete window[callbackName];
    script.remove();

    if (data.status === "SUCCESS") {
      alert(
        "BERHASIL!\n" +
        data.nama + "\n" +
        "Sesi: " + data.sesi + "\n" +
        "Terpakai: " + data.terpakai + "/" + data.total + "\n" +
        "Sisa: " + data.sisa + " porsi"
      );
    } else {
      alert(data.message || "Pengambilan gagal.");
    }

    sedangMemproses = false;
  };

  script.onerror = function() {
    delete window[callbackName];
    script.remove();
    alert("Gagal menghubungi server.");
    sedangMemproses = false;
  };

  script.src = API_URL + "?" + query.toString();
  document.body.appendChild(script);
}

</script>

</body>
</html>
