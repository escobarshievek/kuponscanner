
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Konsumsi Keluarga</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #f3f4f6;
  font-family: Arial, sans-serif;
  color: #222;
}

.container {
  max-width: 480px;
  margin: 20px auto;
  padding: 22px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

h2 { text-align: center; margin-top: 0; }

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 22px;
  font-size: 14px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

select, button {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  font-size: 16px;
}

select {
  border: 1px solid #ccc;
  margin-bottom: 15px;
  background: white;
}

button {
  border: none;
  cursor: pointer;
  color: white;
  font-weight: bold;
  background: #176b45;
  margin-bottom: 10px;
}

button:disabled { background: #999; }

#stopButton {
  background: #b42318;
  display: none;
}

#reader {
  width: 100%;
  margin-top: 15px;
  overflow: hidden;
  border-radius: 10px;
}

#status {
  margin-top: 15px;
  padding: 13px;
  border-radius: 8px;
  background: #f1f1f1;
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
}

.success { background: #dcfce7 !important; color: #166534; }
.error { background: #fee2e2 !important; color: #991b1b; }
.warning { background: #fef3c7 !important; color: #92400e; }

.result {
  margin-top: 15px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
  display: none;
  line-height: 1.8;
}

.result strong {
  display: inline-block;
  min-width: 115px;
}

.note {
  color: #777;
  font-size: 12px;
  text-align: center;
  margin-top: 15px;
}
</style>
</head>

<body>
<div class="container">

  <h2>Scanner Konsumsi Keluarga</h2>
  <div class="subtitle">Sistem Pengambilan Konsumsi</div>

  <label for="sesi">Pilih Sesi Pengambilan</label>

  <select id="sesi">
    <option value="pagi">Makan Pagi</option>
    <option value="siang">Makan Siang</option>
  </select>

  <button id="startButton" onclick="mulaiScanner()">Mulai Scanner</button>
  <button id="stopButton" onclick="berhentiScanner()">Hentikan Scanner</button>

  <div id="reader"></div>

  <div id="status">
    Scanner belum aktif. Tekan Mulai Scanner.
  </div>

  <div id="result" class="result"></div>

  <div class="note">
    Setiap QR yang berhasil dipindai dihitung sebagai 1 porsi.
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzvgZK6ki-VfWvsoPXzeNvRy6sV7xyANSywjCKboNExVy6TJ-CQD5IUmsiFHk2ZJVcS/exec";

let scanner = null;
let scannerAktif = false;
let sedangMemproses = false;
let nomorCallback = 0;
let timerResume = null;


function tampilStatus(pesan, tipe = "") {
  const el = document.getElementById("status");
  el.className = tipe;
  el.textContent = pesan;
}


function amanHTML(teks) {
  return String(teks ?? "").replace(/[&<>"']/g, function(c) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[c];
  });
}


function tampilHasil(data) {
  const box = document.getElementById("result");
  box.style.display = "block";

  box.innerHTML = `
    <div><strong>ID Keluarga:</strong> ${amanHTML(data.id)}</div>
    <div><strong>Nama:</strong> ${amanHTML(data.nama)}</div>
    <div><strong>Instansi:</strong> ${amanHTML(data.instansi)}</div>
    <div><strong>Sesi:</strong> ${amanHTML(data.sesi)}</div>
    <hr>
    <div><strong>Total Kebutuhan:</strong> ${data.total ?? 0}</div>
    <div><strong>Sudah Diambil:</strong> ${data.terpakai ?? 0}</div>
    <div><strong>Sisa Kuota:</strong> ${data.sisa ?? 0}</div>
  `;
}


function panggilServer(parameter) {
  return new Promise((resolve, reject) => {
    const callbackName = "callbackScan" + (++nomorCallback);
    const script = document.createElement("script");

    const query = new URLSearchParams({
      ...parameter,
      callback: callbackName
    });

    let selesai = false;

    const timeout = setTimeout(() => {
      bersihkan();
      reject(new Error("Server tidak merespons. Periksa LOG_SCAN sebelum scan ulang."));
    }, 20000);

    function bersihkan() {
      if (selesai) return;

      selesai = true;
      clearTimeout(timeout);
      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    window[callbackName] = function(data) {
      bersihkan();
      resolve(data);
    };

    script.onerror = function() {
      bersihkan();
      reject(new Error("Gagal menghubungi Apps Script."));
    };

    script.src = API_URL + "?" + query.toString();
    document.body.appendChild(script);
  });
}


async function mulaiScanner() {
  if (scannerAktif) return;

  document.getElementById("startButton").disabled = true;
  tampilStatus("Meminta izin kamera...");

  try {
    if (!scanner) {
      scanner = new Html5Qrcode("reader");
    }

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      berhasilScan,
      function() {}
    );

    scannerAktif = true;

    document.getElementById("startButton").style.display = "none";
    document.getElementById("stopButton").style.display = "block";

    tampilStatus("Scanner aktif. Arahkan kamera ke QR Code.", "success");

  } catch (error) {
    tampilStatus("Kamera gagal dibuka: " + error.message, "error");
    document.getElementById("startButton").disabled = false;
  }
}


async function berhasilScan(teksQR) {
  if (sedangMemproses) return;

  const id = String(teksQR).trim();
  if (!id) return;

  sedangMemproses = true;

  try {
    scanner.pause(true);
  } catch (error) {}

  tampilStatus("QR terbaca. Sedang memproses...");
  document.getElementById("result").style.display = "none";

  const sesi = document.getElementById("sesi").value;

  try {
    const data = await panggilServer({
      action: "scan",
      id: id,
      sesi: sesi
    });

    if (data.status === "SUCCESS") {
      tampilStatus("BERHASIL! Pengambilan 1 porsi telah dicatat.", "success");
      tampilHasil(data);

    } else if (data.status === "FULL") {
      tampilStatus("KUOTA HABIS! Tidak bisa mengambil porsi lagi.", "warning");
      tampilHasil(data);

    } else {
      tampilStatus(data.message || "Terjadi kesalahan.", "error");
    }

  } catch (error) {
    tampilStatus(error.message, "error");

  } finally {
    timerResume = setTimeout(() => {
      sedangMemproses = false;

      if (scanner && scannerAktif) {
        try {
          scanner.resume();
          tampilStatus("Scanner aktif. Siap memindai QR berikutnya.", "success");
        } catch (error) {
          tampilStatus("Scanner perlu dimulai ulang.", "warning");
        }
      }
    }, 2500);
  }
}


async function berhentiScanner() {
  if (timerResume) {
    clearTimeout(timerResume);
    timerResume = null;
  }

  sedangMemproses = false;

  try {
    if (scanner && scannerAktif) {
      await scanner.stop();
      scanner.clear();
    }
  } catch (error) {}

  scannerAktif = false;

  document.getElementById("startButton").style.display = "block";
  document.getElementById("startButton").disabled = false;
  document.getElementById("stopButton").style.display = "none";

  tampilStatus("Scanner dihentikan.");
}
</script>
</body>
</html>
