
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCR Ticket Validator</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172033;
}

.container {
  max-width: 440px;
  margin: auto;
}

.header {
  text-align: center;
  margin-bottom: 22px;
}

.header h2 {
  margin-bottom: 5px;
  color: #123b63;
}

.header p {
  color: #64748b;
  font-size: 13px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
  margin-bottom: 15px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 15px;
  margin-bottom: 14px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

.start {
  background: #145b94;
  color: white;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
}

#reader video {
  border-radius: 12px;
}

.result {
  display: none;
  padding: 18px;
  border-radius: 12px;
  margin-top: 15px;
}

.valid {
  background: #dcfce7;
  color: #166534;
}

.used {
  background: #fee2e2;
  color: #991b1b;
}

.invalid {
  background: #fef3c7;
  color: #92400e;
}

.result h3 {
  margin-top: 0;
}

.result p {
  font-size: 14px;
  margin: 7px 0;
}

.small {
  font-size: 12px;
  color: #64748b;
  text-align: center;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>PCR TICKET VALIDATOR</h2>
    <p>Sistem Validasi Tiket dan Kartu Peserta</p>
  </div>

  <div class="card">

    <label>PIN PETUGAS</label>
    <input
      type="password"
      id="pin"
      placeholder="Masukkan PIN petugas"
      autocomplete="off"
    >

    <button class="start" id="startBtn" onclick="startCamera()">
      AKTIFKAN KAMERA
    </button>

  </div>

  <div class="card">
    <div id="reader"></div>
    <p class="small" id="cameraStatus">
      Kamera belum diaktifkan.
    </p>
  </div>

  <div id="result" class="result">
    <h3 id="resultTitle"></h3>
    <p id="resultMessage"></p>
    <p id="resultName"></p>
    <p id="resultId"></p>
    <p id="resultInstansi"></p>
  </div>

  <p class="small">
    POLITEKNIK CALTEX RIAU<br>
    Ticket Validation System
  </p>

</div>

<script>

// GANTI DENGAN URL WEB APP APPS SCRIPT.
const API_URL = 'MASUKKAN_URL_WEB_APP_APPS_SCRIPT';

let scanner = null;
let scanning = false;
let processing = false;
let callbackCounter = 0;

// Memanggil backend menggunakan JSONP.
function callAPI(id, pin) {

  return new Promise((resolve, reject) => {

    const callbackName =
      'qrCallback_' + (++callbackCounter);

    const script = document.createElement('script');

    const params = new URLSearchParams({
      action: 'validate',
      id: id,
      pin: pin,
      callback: callbackName,
      _: Date.now()
    });

    const cleanup = () => {
      delete window[callbackName];
      script.remove();
    };

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('Server tidak merespons.'));
    }, 15000);

    window[callbackName] = function(data) {
      clearTimeout(timeout);
      cleanup();
      resolve(data);
    };

    script.onerror = function() {
      clearTimeout(timeout);
      cleanup();
      reject(new Error('Gagal menghubungi server.'));
    };

    script.src = API_URL + '?' + params.toString();

    document.body.appendChild(script);

  });
}

// Aktifkan kamera HP.
async function startCamera() {

  if (API_URL.startsWith('MASUKKAN')) {
    alert('URL Apps Script belum diisi.');
    return;
  }

  const pin = document.getElementById('pin').value.trim();

  if (!pin) {
    alert('Masukkan PIN petugas terlebih dahulu.');
    return;
  }

  if (scanning) return;

  scanner = new Html5Qrcode('reader');

  try {

    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        },
        aspectRatio: 1
      },
      onScanSuccess
    );

    scanning = true;

    document.getElementById('cameraStatus')
      .textContent = 'Kamera aktif. Arahkan ke QR Code.';

    document.getElementById('startBtn')
      .textContent = 'KAMERA AKTIF';

  } catch (error) {

    alert(
      'Kamera gagal diaktifkan. ' +
      'Pastikan izin kamera sudah diberikan dan halaman dibuka melalui HTTPS.'
    );

    console.error(error);

  }
}

// Ketika QR berhasil terbaca.
async function onScanSuccess(decodedText) {

  if (processing) return;

  processing = true;

  try {

    await scanner.pause(true);

    const id = decodedText.trim();

    showMessage(
      'Memeriksa tiket...',
      'Sedang memeriksa database peserta.',
      'invalid'
    );

    const pin = document.getElementById('pin').value.trim();

    const data = await callAPI(id, pin);

    showResult(data);

    // Jeda sebelum scan berikutnya.
    setTimeout(() => {

      if (scanner && scanning) {
        scanner.resume();
      }

      processing = false;

    }, 2500);

  } catch (error) {

    showMessage(
      'KONEKSI GAGAL',
      error.message,
      'invalid'
    );

    setTimeout(() => {

      if (scanner && scanning) {
        scanner.resume();
      }

      processing = false;

    }, 2500);

  }
}

// Menampilkan hasil validasi.
function showResult(data) {

  const box = document.getElementById('result');

  box.style.display = 'block';
  box.className = 'result';

  document.getElementById('resultTitle').textContent = '';
  document.getElementById('resultMessage').textContent =
    data.message || '';

  document.getElementById('resultName').textContent =
    data.nama ? 'Nama: ' + data.nama : '';

  document.getElementById('resultId').textContent =
    data.id ? 'ID: ' + data.id : '';

  document.getElementById('resultInstansi').textContent =
    data.instansi ? 'Instansi: ' + data.instansi : '';

  if (data.status === 'VALID') {

    box.classList.add('valid');
    document.getElementById('resultTitle').textContent =
      '✓ TIKET VALID';

  } else if (data.status === 'USED') {

    box.classList.add('used');
    document.getElementById('resultTitle').textContent =
      '✕ SUDAH DIGUNAKAN';

  } else {

    box.classList.add('invalid');
    document.getElementById('resultTitle').textContent =
      '⚠ TIDAK VALID';

  }
}

function showMessage(title, message, type) {

  const box = document.getElementById('result');

  box.style.display = 'block';
  box.className = 'result ' + type;

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMessage').textContent = message;

  document.getElementById('resultName').textContent = '';
  document.getElementById('resultId').textContent = '';
  document.getElementById('resultInstansi').textContent = '';

}

</script>

</body>
</html>
